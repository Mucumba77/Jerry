name: Publish versioned distributions
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./frontend/package.json').version")"
          sh build.sh
          node --test scripts/testenv/history-charts.test.mjs scripts/testenv/connector-traffic.test.mjs scripts/testenv/i18n.test.mjs scripts/testenv/sql-completion.test.mjs
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/jerry-2.1.0-tomcat*.war dist/jerry-2.1.0-tomcat*.war.sha256 dist/jerry-instrumentation-2.1.0-*.jar --generate-notes
          fi

