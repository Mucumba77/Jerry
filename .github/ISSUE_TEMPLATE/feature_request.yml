name: Feature request
description: Suggest an improvement to Jerry.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Describe the proposed behavior
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Alternatives and additional context
