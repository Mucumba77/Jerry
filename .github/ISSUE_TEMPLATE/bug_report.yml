name: Bug report
description: Report a reproducible Jerry problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, SQL containing private data, production logs or exploitable security details. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Jerry version, WAR, Tomcat and Java versions
      placeholder: 'Jerry 2.1.0, tomcat9 WAR, Tomcat 9.x, Java 8'
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Browser, database, JDBC driver and framework versions, if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs, screenshots and additional context
